# Buduje stronę (Astro) i wdraża ją przez FTP do katalogu /new.
#
# Wymagane sekrety repozytorium (Settings → Secrets and variables → Actions):
#   FTP_SERVER    – adres serwera, np. ftp.example.pl
#   FTP_USERNAME  – login FTP
#   FTP_PASSWORD  – hasło FTP
# Opcjonalne zmienne (zakładka „Variables”):
#   FTP_PROTOCOL  – ftp (domyślnie), ftps albo ftps-legacy
#   FTP_PORT      – domyślnie 21
#
# Dopóki sekrety nie są ustawione, pipeline tylko buduje stronę i pomija wdrożenie.

name: Build i wdrożenie

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Sprawdzenie typów
        run: npm run check

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Wdrożenie FTP → /new
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Sprawdzenie konfiguracji
        id: cfg
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::Brak sekretu FTP_SERVER – wdrożenie pominięte."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          name: dist
          path: dist/

      - name: Wysyłka na FTP
        if: steps.cfg.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: /new/
