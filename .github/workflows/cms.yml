# Publikuje panel treści (katalog cms/) na GitHub Pages.
# Jednorazowo: Settings → Pages → Source: „GitHub Actions”.

name: Panel CMS (GitHub Pages)

on:
  push:
    branches: [master]
    paths: ['cms/**', '.github/workflows/cms.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cms
      - id: deployment
        uses: actions/deploy-pages@v4
